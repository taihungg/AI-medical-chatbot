<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-fixed": "#72f7ed",
                    "on-primary-container": "#f3f7ff",
                    "surface-tint": "#006399",
                    "error": "#ba1a1a",
                    "on-primary-fixed-variant": "#004b74",
                    "outline": "#707881",
                    "on-primary-fixed": "#001d32",
                    "primary": "#005d90",
                    "on-surface": "#191c1e",
                    "on-background": "#191c1e",
                    "tertiary-fixed-dim": "#50dad1",
                    "surface": "#f7f9fb",
                    "secondary": "#00677d",
                    "secondary-fixed-dim": "#4cd6fb",
                    "secondary-container": "#50d9fe",
                    "on-secondary-container": "#005c70",
                    "surface-container": "#eceef0",
                    "tertiary-container": "#007f78",
                    "surface-container-highest": "#e0e3e5",
                    "inverse-surface": "#2d3133",
                    "on-tertiary-container": "#d7fffa",
                    "on-error": "#ffffff",
                    "background": "#f7f9fb",
                    "on-primary": "#ffffff",
                    "outline-variant": "#bfc7d1",
                    "surface-container-high": "#e6e8ea",
                    "on-secondary-fixed": "#001f27",
                    "surface-bright": "#f7f9fb",
                    "error-container": "#ffdad6",
                    "on-tertiary-fixed-variant": "#00504b",
                    "primary-container": "#0077b6",
                    "inverse-primary": "#94ccff",
                    "surface-container-low": "#f2f4f6",
                    "primary-fixed-dim": "#94ccff",
                    "primary-fixed": "#cde5ff",
                    "on-error-container": "#93000a",
                    "inverse-on-surface": "#eff1f3",
                    "secondary-fixed": "#b3ebff",
                    "tertiary": "#00645f",
                    "surface-variant": "#e0e3e5",
                    "on-tertiary-fixed": "#00201e",
                    "on-surface-variant": "#404850",
                    "surface-dim": "#d8dadc",
                    "on-tertiary": "#ffffff",
                    "on-secondary": "#ffffff",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary-fixed-variant": "#004e5f"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack_sm": "12px",
                    "gutter": "16px",
                    "stack_md": "24px",
                    "stack_lg": "40px",
                    "container_padding": "24px",
                    "base": "8px"
            },
            "fontFamily": {
                    "h3": ["Poppins"],
                    "label-caps": ["Inter"],
                    "h2": ["Poppins"],
                    "h1": ["Poppins"],
                    "body-md": ["Inter"],
                    "body-lg": ["Inter"]
            },
            "fontSize": {
                    "h3": ["20px", {"lineHeight": "1.4", "fontWeight": "500"}],
                    "label-caps": ["12px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "h2": ["24px", {"lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "h1": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1.5px solid rgba(255, 255, 255, 0.4);
        }
        .dark .glass-card {
            background: rgba(28, 30, 33, 0.7);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
        }
        .mesh-gradient {
            background-color: #f7f9fb;
            background-image: 
                radial-gradient(at 0% 0%, rgba(80, 217, 254, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(0, 93, 144, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(80, 217, 254, 0.15) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(0, 93, 144, 0.1) 0px, transparent 50%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="mesh-gradient min-h-screen text-on-surface selection:bg-secondary-container">
<!-- TopAppBar -->
<header class="bg-white/70 dark:bg-surface-container/70 backdrop-blur-[24px] border-b border-white/40 dark:border-outline-variant/20 shadow-[0_8px_32px_0_rgba(0,93,144,0.08)] docked full-width top-0 sticky z-50 flex justify-between items-center w-full px-container_padding py-base">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-primary p-2 hover:bg-white/20 transition-all duration-300 rounded-full active:scale-95">arrow_back</button>
<h1 class="font-h2 text-h2 text-primary dark:text-primary-fixed tracking-tight">Lên lịch Hẹn</h1>
</div>
<div class="flex items-center gap-3">
<img alt="Doctor Profile" class="w-10 h-10 rounded-full object-cover border-2 border-primary/20" data-alt="A professional headshot of a verified healthcare professional in a modern clinical setting. The doctor is wearing a clean white lab coat and a stethoscope, smiling warmly with a soft, blurred medical background. The lighting is bright and high-key, emphasizing a light-mode aesthetic with clean, professional tones." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA2HoOvUMoBAgMRqhLbTgb7-EhdkhOjTvxIXHSDJ7E5DJbaV_z5td6AjGZAsdyQV3rT_F7jXvR_0zu3J6bGm9SWosibrh0iP13N6ya4wm4jQEmV0kj4T1JiXqZFFYdUPfQJzT6lE_YfUVDcf5Ghn9UVShSnnQk_HfnQJo_wDKb7__SW-sntT7MtlXmpAX1ayItbD27W9SoHEWpH_rQ6--a3NIT3tVWuAbxsAjTtP1PWWtgwnX-OkJ-Qo8BYY3CIXg8mpuBhNMUwjKo">
<span class="material-symbols-outlined text-primary hover:bg-white/20 transition-all duration-300 p-2 rounded-full">notifications</span>
</div>
</header>
<main class="max-w-md mx-auto px-gutter py-stack_md space-y-stack_md pb-32">
<!-- Patient Brief Info -->
<section class="glass-card rounded-[24px] p-container_padding flex items-center gap-4">
<div class="bg-primary-container/20 w-12 h-12 rounded-full flex items-center justify-center text-primary">
<span class="material-symbols-outlined">person</span>
</div>
<div>
<p class="font-label-caps text-label-caps text-on-surface-variant">TÁI KHÁM BỆNH NHÂN</p>
<h2 class="font-h3 text-h3 text-primary">Elena Rodriguez</h2>
</div>
</section>
<!-- Location Selection -->
<section class="space-y-stack_sm">
<h3 class="font-label-caps text-label-caps text-on-surface-variant ml-2 uppercase">CHỌN CHI NHÁNH PHÒNG KHÁM</h3>
<div class="grid grid-cols-2 gap-3">
<button class="glass-card p-4 rounded-xl flex items-center justify-center gap-2 border-primary ring-2 ring-primary ring-offset-2 transition-all duration-300">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">location_on</span>
<span class="font-body-md text-primary font-bold">Chi nhánh A</span>
</button>
<button class="glass-card p-4 rounded-xl flex items-center justify-center gap-2 hover:bg-white/40 transition-all duration-300">
<span class="material-symbols-outlined text-on-surface-variant">location_on</span>
<span class="font-body-md text-on-surface-variant">Chi nhánh B</span>
</button>
<button class="glass-card p-4 rounded-xl flex items-center justify-center gap-2 hover:bg-white/40 transition-all duration-300">
<span class="material-symbols-outlined text-on-surface-variant">location_on</span>
<span class="font-body-md text-on-surface-variant">Chi nhánh C</span>
</button>
<button class="glass-card p-4 rounded-xl flex items-center justify-center gap-2 hover:bg-white/40 transition-all duration-300">
<span class="material-symbols-outlined text-on-surface-variant">location_on</span>
<span class="font-body-md text-on-surface-variant">Chi nhánh D</span>
</button>
</div>
</section>
<!-- Calendar View -->
<section class="glass-card rounded-[24px] p-container_padding space-y-4">
<div class="flex justify-between items-center mb-2">
<h3 class="font-h3 text-h3 text-primary">Tháng 10 năm 2023</h3>
<div class="flex gap-2">
<button class="material-symbols-outlined p-1 text-on-surface-variant">chevron_left</button>
<button class="material-symbols-outlined p-1 text-on-surface-variant">chevron_right</button>
</div>
</div>
<div class="grid grid-cols-7 gap-1 text-center">
<!-- Days of week -->
<span class="text-[10px] font-bold text-outline uppercase">T2</span>
<span class="text-[10px] font-bold text-outline uppercase">T3</span>
<span class="text-[10px] font-bold text-outline uppercase">T4</span>
<span class="text-[10px] font-bold text-outline uppercase">T5</span>
<span class="text-[10px] font-bold text-outline uppercase">T6</span>
<span class="text-[10px] font-bold text-outline uppercase">T7</span>
<span class="text-[10px] font-bold text-outline uppercase">CN</span>
<!-- Dummy Days -->
<span class="p-2 text-outline-variant text-body-md">25</span>
<span class="p-2 text-outline-variant text-body-md">26</span>
<span class="p-2 text-outline-variant text-body-md">27</span>
<span class="p-2 text-outline-variant text-body-md">28</span>
<span class="p-2 text-outline-variant text-body-md">29</span>
<span class="p-2 text-outline-variant text-body-md">30</span>
<button class="p-2 text-body-md font-bold text-on-surface hover:bg-primary/10 rounded-lg">1</button>
<!-- Active week selection example -->
<button class="p-2 text-body-md text-on-surface hover:bg-primary/10 rounded-lg">2</button>
<button class="p-2 text-body-md text-on-surface hover:bg-primary/10 rounded-lg">3</button>
<button class="p-2 text-body-md text-on-surface hover:bg-primary/10 rounded-lg">4</button>
<button class="p-2 text-body-md text-on-surface hover:bg-primary/10 rounded-lg">5</button>
<button class="p-2 bg-primary text-on-primary font-bold rounded-lg shadow-lg">6</button>
<button class="p-2 text-body-md text-on-surface hover:bg-primary/10 rounded-lg">7</button>
<button class="p-2 text-body-md text-on-surface hover:bg-primary/10 rounded-lg">8</button>
</div>
</section>
<!-- Time Slots Selection -->
<section class="space-y-stack_sm">
<div class="flex justify-between items-center px-2">
<h3 class="font-label-caps text-label-caps text-on-surface-variant uppercase">ĐỀ XUẤT KHUNG GIỜ</h3>
<span class="text-[11px] text-primary font-semibold">Đã bật chọn nhiều mục</span>
</div>
<div class="flex flex-wrap gap-2">
<button class="bg-secondary-container text-on-secondary-container px-5 py-3 rounded-full font-label-caps text-label-caps border border-secondary shadow-[0_0_15px_rgba(80,217,254,0.3)] flex items-center gap-2">
                    09:00 AM <span class="material-symbols-outlined text-[14px]">check_circle</span>
</button>
<button class="glass-card px-5 py-3 rounded-full font-label-caps text-label-caps text-on-surface-variant hover:bg-white/50 transition-all">
                    10:30 AM
                </button>
<button class="bg-secondary-container text-on-secondary-container px-5 py-3 rounded-full font-label-caps text-label-caps border border-secondary shadow-[0_0_15px_rgba(80,217,254,0.3)] flex items-center gap-2">
                    01:15 PM <span class="material-symbols-outlined text-[14px]">check_circle</span>
</button>
<button class="glass-card px-5 py-3 rounded-full font-label-caps text-label-caps text-on-surface-variant hover:bg-white/50 transition-all">
                    02:00 PM
                </button>
<button class="glass-card px-5 py-3 rounded-full font-label-caps text-label-caps text-on-surface-variant hover:bg-white/50 transition-all">
                    04:45 PM
                </button>
</div>
</section>
<!-- Add Note Section -->
<section class="glass-card rounded-[24px] p-container_padding space-y-2">
<h3 class="font-label-caps text-label-caps text-on-surface-variant uppercase">GHI CHÚ CỦA BÁC SĨ</h3>
<div class="bg-surface-container-low/50 rounded-xl p-3 border border-outline-variant/30">
<textarea class="w-full bg-transparent border-none focus:ring-0 text-body-md text-on-surface placeholder:text-outline-variant" placeholder="Thêm hướng dẫn cụ thể cho bệnh nhân..." rows="2"></textarea>
</div>
</section>
</main>
<!-- Fixed Action Button (Bottom) -->
<div class="fixed bottom-0 left-0 right-0 p-gutter bg-gradient-to-t from-background via-background/90 to-transparent pb-8">
<button class="w-full max-w-md mx-auto bg-gradient-to-r from-primary to-secondary text-on-primary font-h3 text-h3 py-4 rounded-2xl shadow-[0_12px_24px_rgba(0,93,144,0.2)] flex items-center justify-center gap-3 active:scale-[0.98] transition-all"><span class="material-symbols-outlined">send</span> Gửi Lịch cho Bệnh nhân</button>
</div>


</body></html>
