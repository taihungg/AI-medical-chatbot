<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>High-Urgency SOS Alert | AI Care Bridge</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "tertiary-fixed": "#72f7ed",
                      "on-primary-container": "#f3f7ff",
                      "surface-tint": "#006399",
                      "error": "#ba1a1a",
                      "on-primary-fixed-variant": "#004b74",
                      "outline": "#707881",
                      "on-primary-fixed": "#001d32",
                      "primary": "#005d90",
                      "on-surface": "#191c1e",
                      "on-background": "#191c1e",
                      "tertiary-fixed-dim": "#50dad1",
                      "surface": "#f7f9fb",
                      "secondary": "#00677d",
                      "secondary-fixed-dim": "#4cd6fb",
                      "secondary-container": "#50d9fe",
                      "on-secondary-container": "#005c70",
                      "surface-container": "#eceef0",
                      "tertiary-container": "#007f78",
                      "surface-container-highest": "#e0e3e5",
                      "inverse-surface": "#2d3133",
                      "on-tertiary-container": "#d7fffa",
                      "on-error": "#ffffff",
                      "background": "#f7f9fb",
                      "on-primary": "#ffffff",
                      "outline-variant": "#bfc7d1",
                      "surface-container-high": "#e6e8ea",
                      "on-secondary-fixed": "#001f27",
                      "surface-bright": "#f7f9fb",
                      "error-container": "#ffdad6",
                      "on-tertiary-fixed-variant": "#00504b",
                      "primary-container": "#0077b6",
                      "inverse-primary": "#94ccff",
                      "surface-container-low": "#f2f4f6",
                      "primary-fixed-dim": "#94ccff",
                      "primary-fixed": "#cde5ff",
                      "on-error-container": "#93000a",
                      "inverse-on-surface": "#eff1f3",
                      "secondary-fixed": "#b3ebff",
                      "tertiary": "#00645f",
                      "surface-variant": "#e0e3e5",
                      "on-tertiary-fixed": "#00201e",
                      "on-surface-variant": "#404850",
                      "surface-dim": "#d8dadc",
                      "on-tertiary": "#ffffff",
                      "on-secondary": "#ffffff",
                      "surface-container-lowest": "#ffffff",
                      "on-secondary-fixed-variant": "#004e5f"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "stack_sm": "12px",
                      "gutter": "16px",
                      "stack_md": "24px",
                      "stack_lg": "40px",
                      "container_padding": "24px",
                      "base": "8px"
              },
              "fontFamily": {
                      "h3": ["Poppins"],
                      "label-caps": ["Inter"],
                      "h2": ["Poppins"],
                      "h1": ["Poppins"],
                      "body-md": ["Inter"],
                      "body-lg": ["Inter"]
              },
              "fontSize": {
                      "h3": ["20px", {"lineHeight": "1.4", "fontWeight": "500"}],
                      "label-caps": ["12px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600"}],
                      "h2": ["24px", {"lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "h1": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600"}],

                      "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}]
              }
            },
          },
        }
    </script>
<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1.5px solid rgba(255, 255, 255, 0.4);
        }
        .urgent-pulse {
            background: radial-gradient(circle, rgba(186, 26, 26, 0.2) 0%, rgba(247, 249, 251, 0) 70%);
            animation: pulse-ring 2s infinite ease-in-out;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex flex-col font-body-md text-on-surface overflow-hidden relative">
<!-- SOS Background Effect -->
<div class="fixed inset-0 pointer-events-none z-0">
<div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-error/10 via-background to-background"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[150%] h-[150%] urgent-pulse pointer-events-none"></div>
</div>
<!-- Main Content Wrapper (Canvas) -->
<main class="relative z-10 flex-1 flex items-center justify-center px-container_padding">
<!-- Emergency Alert Container (Bento/Glass Card) -->
<div class="glass-card w-full max-w-lg rounded-[32px] p-stack_md shadow-[0_40px_80px_rgba(186,26,26,0.15)] flex flex-col gap-stack_md">
<!-- Urgent Header -->
<div class="flex flex-col items-center text-center gap-base">
<div class="w-20 h-20 bg-error rounded-full flex items-center justify-center shadow-[0_0_30px_rgba(186,26,26,0.4)] animate-bounce">
<span class="material-symbols-outlined text-[48px] text-white" data-icon="emergency" style="font-variation-settings: 'FILL' 1;">emergency</span>
</div>
<div class="mt-4">
<span class="font-label-caps text-label-caps text-error bg-error-container px-3 py-1 rounded-full">CẢNH BÁO KHẨN CẤP</span>
<h1 class="font-h1 text-h1 text-on-surface mt-2 tracking-tight">Yêu cầu SOS</h1>
</div>
</div>
<!-- Patient Detail Bento -->
<div class="grid grid-cols-1 gap-4">
<div class="glass-card bg-white/40 dark:bg-surface-container-low/40 p-container_padding rounded-[24px] border border-error/20">
<div class="flex items-start gap-gutter">
<div class="relative">
<img class="w-16 h-16 rounded-2xl object-cover border-2 border-error" data-alt="A professional medical profile portrait of a female patient with a concerned expression, set against a softly blurred clinical background with high-key lighting. The image style is clean and sophisticated, mirroring the healthcare brand's high-trust and empathetic aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAAVDUlZhJ0zuQnev60i_28bCOwm9JkJ_qCiL3qqxIgpLDPpWBjhTa8nl2gEPBYkbq10h3Ye1VyGS0hzT1SYFtBc7D4tVz4N-vd9toiC8Q6jdPFD1-nM5zwUnR2SCLXwTzBLjVA-zsJO46q9zGkABWhkS81WBnjEzfdDjuxLhKhUQYDwKcp4avtuxTwKeYb7jKOcuad0g-h9iDN5sIAXmqrsqKtoZb0emAtRnNTNSBkJEqHh3uZM8flibpVwrt78G0OSUS6HikTHLk">
<div class="absolute -bottom-1 -right-1 bg-error rounded-full p-1 border-2 border-white">
<span class="material-symbols-outlined text-[12px] text-white" data-icon="favorite" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
</div>
<div class="flex-1">
<h2 class="font-h2 text-h2 text-on-surface leading-tight">Elena Rostova</h2>
<p class="font-body-md text-error font-bold flex items-center gap-1"><span class="material-symbols-outlined text-base" data-icon="warning">warning</span> Suy tim cấp</p>
</div>
</div>
<div class="mt-6 grid grid-cols-2 gap-4">
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-on-surface-variant">NHỊP TIM</span>
<span class="font-h3 text-h3 text-error">142 BPM</span>
</div>
<div class="flex-col flex">
<span class="font-label-caps text-label-caps text-on-surface-variant">BP</span>
<span class="font-h3 text-h3 text-on-surface">165 / 105</span>
</div>
<div class="flex-col flex">
<span class="font-label-caps text-label-caps text-on-surface-variant">SPO2</span>
<span class="font-h3 text-h3 text-on-surface">88%</span>
</div>
<div class="flex-col flex">
<span class="font-label-caps text-label-caps text-on-surface-variant">VỊ TRÍ</span>
<span class="font-body-md text-body-md text-on-surface font-semibold">Khu 4, Phòng 202</span>
</div>
</div>
</div>
</div>
<!-- AI Insight Note -->
<div class="flex items-center gap-3 p-4 bg-primary-container/20 rounded-[20px]">
<span class="material-symbols-outlined text-primary" data-icon="auto_awesome">auto_awesome</span>
<p class="font-body-md text-on-surface-variant italic">AI đã phát hiện các kiểu loạn nhịp tim bất thường cách đây 2 phút.</p>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-4">
<button class="w-full h-14 bg-gradient-to-r from-primary to-secondary text-white font-bold rounded-full shadow-[0_8px_24px_rgba(0,93,144,0.3)] active:scale-95 transition-all duration-200 flex items-center justify-center gap-2"><span class="material-symbols-outlined" data-icon="bolt" style="font-variation-settings: &quot;FILL&quot; 1;">bolt</span> Phản hồi Ngay</button>
<div class="grid grid-cols-2 gap-4">
<button class="h-14 border-2 border-secondary text-secondary font-bold rounded-full flex items-center justify-center gap-2 hover:bg-secondary/5 transition-colors"><span class="material-symbols-outlined" data-icon="move_up">move_up</span> Chuyển ca</button>
<button class="h-14 bg-surface-container-highest text-on-surface-variant font-bold rounded-full flex items-center justify-center gap-2"><span class="material-symbols-outlined" data-icon="group">group</span> Gọi Đội ngũ</button>
</div>
</div>
<!-- Mute temporarily -->
<button class="text-on-surface-variant font-label-caps text-label-caps hover:text-error transition-colors self-center py-2">Tắt thông báo trong 30 giây</button>
</div>
</main>
<!-- Bottom Decorative Mesh (Subtle) -->
<div class="fixed bottom-0 left-0 w-full h-1/3 bg-gradient-to-t from-secondary/10 to-transparent pointer-events-none -z-10"></div>


</body></html>
